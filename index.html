<style>
    :root {
        --bg-body: #f4f7fc; --bg-card: #ffffff; --text-main: #333333;
        --text-muted: #718096; --border-color: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        --radius: 12px; --primary: #2b6cb0; --success: #38a169; --danger: #e53e3e;
    }

    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); padding: 15px 30px; border-radius: var(--radius); color: white; margin-bottom: 20px; box-shadow: var(--shadow); }
    .header-nav {
    display: flex;
    gap: 6px;
    align-items: center;
}
    .btn-nav { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .btn-nav.active { background: white; color: var(--primary); font-weight: 700; }

.top-grid { 
    display: grid; 
    /* El uso de 0min permite que las columnas se encojan al máximo */
    grid-template-columns: repeat(4, minmax(0, 1fr)); 
    gap: 10px; /* Espacio reducido entre tarjetas */
    margin-bottom: 20px;
    align-items: start; /* Alinea las tarjetas al tope */
}

.card-action {
    background: var(--bg-card); 
    padding: 12px; /* Reducido de 20px para ganar espacio */
    border-radius: var(--radius); 
    border: 1px solid var(--border-color);
    min-width: 0; /* Crucial para que el grid pueda encoger la tarjeta */
    overflow: hidden;
}

/* Ajuste específico para la tabla de stock cuando está arriba */
.card-action table {
    font-size: 11px; /* Letra más pequeña para que quepa en la columna */
}

.card-action h3 {
    font-size: 14px; /* Títulos ligeramente más pequeños */
    margin-top: 0;
}
    
    .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
    .input-box { display: flex; border: 1px solid var(--border-color); border-radius: 8px; flex: 1; overflow: hidden; background: #fafafa; }
    .input-box i { padding: 10px; color: var(--text-muted); background: #eee; border-right: 1px solid var(--border-color); }
    input, select { border: none; padding: 10px; width: 100%; background: transparent; outline: none; }
/* Ocultar flechas en inputs de tipo número (Chrome, Safari, Edge, Opera) */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Ocultar flechas en inputs de tipo número (Firefox) */
    input[type=number] {
        -moz-appearance: textfield;
    }

    .btn-action { width: 100%; border: none; padding: 12px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    .btn-ingreso { background: var(--success); }
    .btn-salida { background: var(--danger); }

    .stats-container { display: grid; grid-template-columns: repeat(3, 1fr) auto; background: var(--bg-card); padding: 20px; border-radius: var(--radius); gap: 20px; margin-bottom: 20px; align-items: center; }
    .kpi-block { border-right: 1px solid var(--border-color); padding-right: 20px; }
    .kpi-val { font-size: 22px; font-weight: bold; display: block; }
    .pct-badge { background: #e6fffa; color: #333; padding: 4px 10px; border-radius: 12px; font-size: 14px; font-weight: bold; }

    /* ESTILOS DE GRILLAS INDEPENDIENTES */
    .grid-pasillos { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr); /* Pasillos A y B siempre en 4 */
        gap: 5px;
	row-gap: 50px; 
        background: #e2e8f0; 
        padding: 20px; 
        border-radius: 12px; 
        border: 2px solid #cbd5e0;
        margin-bottom: 20px;
    }
.grid-sectores-d { 
    display: grid; 
    grid-template-columns: repeat(6, minmax(140px, 1fr));
    gap: 5px; 
	row-gap: 50px; 
        background: #e2e8f0; 
        padding: 15px; 
        border-radius: 12px; 
        border: 2px solid #cbd5e0;
    margin-bottom: 20px;
    justify-items: stretch;
}
.grid-sectores-d .card-ubi[data-id="D7"] {
    grid-column: 5;
}
    .galpon-grid { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); /* Esto fuerza el 2x2: E1,E2 arriba / E3,E4 abajo */
        gap: 5px; 
	row-gap: 50px;        
	background: #e2e8f0; 
        padding: 20px; 
        border-radius: 12px; 
        border: 2px solid #cbd5e0;
    }	    


	.patio-grid { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
	column-gap: 250px;
        row-gap: 5px;
        background: #e2e8f0; 
        padding: 20px; 
        border-radius: 12px;
	border: 2px solid #cbd5e0;
    }
    
    .card-ubi { background: white; border-radius: 8px; border: 1px solid #e2e8f0; padding: 10px; text-align: center; position: relative; border-top: 4px solid #cbd5e0; }
    .ubi-green { border-top-color: var(--success); background: #f0fff4; }
    .ubi-yellow { border-top-color: #d69e2e; background: #fffaf0; }
    .ubi-red { border-top-color: var(--danger); background: #fff5f5; }

    .bottom-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    .panel { background: white; border-radius: var(--radius); border: 1px solid var(--border-color); padding: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; color: var(--text-muted); text-transform: uppercase; padding: 10px; border-bottom: 2px solid #f4f4f4; }
    td { padding: 10px; border-bottom: 1px solid #f9f9f9; font-size: 13px; }
/* Estilos para el filtro del mapa */
    .ubi-off { opacity: 0.15; filter: grayscale(1); transition: all 0.3s ease; }
    .ubi-highlight { 
        border: 3px solid #2b6cb0 !important; 
        transform: scale(1.08); 
        z-index: 10; 
        box-shadow: 0 0 20px rgba(43,108,176,0.6);
        transition: all 0.3s ease;

}
.bultos-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
}

.bulto-btn {
    border: 1px solid #ccc;

    cursor: pointer;
    font-size: 12px;
}

.bulto-btn:hover {
    background: #edf2f7;
}

.bulto-btn.active {
    background: #2b6cb0;
    color: white;
    border-color: #2b6cb0;
    font-weight: bold;
}
.btn-nav-small {
    padding: 5px 10px;
    font-size: 11px;
    opacity: 0.85;
}

.btn-nav-small:hover {
    opacity: 1;
}
.menu-opciones {
    position: relative;
}

.menu-dropdown {
    position: absolute;
    top: 40px;
    right: 0;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    display: none;
    min-width: 160px;
    z-index: 1000;
    overflow: hidden;

    /* animación */
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.2s ease;
}

/* estado visible */
.menu-dropdown.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
}

.menu-dropdown div {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s ease;
color: #1f2937;
}

.menu-dropdown div:hover {
    background: #edf2f7;
    color: #1a202c;
}
/* separador */
.menu-divider {
    height: 1px;
    background: #e2e8f0;
    margin: 4px 0;
}
/* Bloqueo preventivo ajustado */
.bottom-grid, .menu-opciones {
    display: none !important;
}
@media (max-width: 768px) {
    /* 1. Forzamos que el cuerpo y los paneles ocupen todo el ancho */
    body {

        width: calc(100% - 20px) !important;
    }

    .stats-container, .panel {

        .card-action h3 {

        }

        /* Iconos y textos de los inputs más pequeños para que quepan */
        .input-box i, .input-box span {

        }

        input, select {
            padding: 5px !important;
            font-size: 10px !important;
        }

        /* Botones compactos */
        .btn-action {
            padding: 8px 2px !important;
            font-size: 9px !important;
        }

        /* Selector de bultos mini */
        .bulto-btn {
            padding: 3px 5px !important;
            font-size: 9px !important;
        }

        /* Tabla de stock por PP miniatura */
        #tabla-stock th, #tabla-stock td {
            font-size: 9px !important;
            padding: 3px !important;
        }

        /* Ajuste de estadísticas para que no ocupen tanto espacio */
        .stats-container {
            grid-template-columns: repeat(3, 1fr);
            padding: 10px;
            gap: 5px;
        }
        
        .kpi-val { font-size: 14px !important; }
        .pct-badge { font-size: 10px !important; }
        #mini-grafico { display: none; } /* Ocultamos gráfico en móvil para ganar espacio */
    }
</style>

function renderBultos() {
    const pesos = pesosValidos;

    ["ingreso", "salida"].forEach(tipo => {
        const selectContainer = document.getElementById(`bultos_${tipo}`);
        if (!selectContainer) return;

        // Limpiamos el menú desplegable
        selectContainer.innerHTML = "";

        // Creamos la opción inicial por defecto
        const defaultOpt = document.createElement('option');
        defaultOpt.value = "";
        defaultOpt.textContent = "Seleccione bulto";
        selectContainer.appendChild(defaultOpt);

        // Inyectamos cada peso válido como una opción seleccionable
        pesos.forEach(p => {
            let opt = document.createElement("option");
            opt.value = p;
            opt.textContent = `${p} kg`;
            
            // Si por algún motivo ya estaba seleccionado, lo marcamos
            if (bultoSeleccionado[tipo] === p) {
                opt.selected = true;
            }

            selectContainer.appendChild(opt);
        });

        // Configuramos qué pasa cuando el usuario cambia la opción del menú
        selectContainer.onchange = function() {
            if (this.value) {
                const pesoElegido = parseFloat(this.value);
                bultoSeleccionado[tipo] = pesoElegido;
                
                // Opcional: notificamos internamente al sistema el cambio
                notificar(`Bulto seleccionado para ${tipo}: ${pesoElegido} kg`, "info");
            } else {
                bultoSeleccionado[tipo] = null;
            }
        };
    });

function autoSeleccionarBulto(tipo) {
    let kgInput = document.getElementById(tipo === "ingreso" ? "kg_in" : "kg_out");
    let kg = parseFloat(kgInput.value);

    if (!kg || kg <= 0) return;

    let encontrado = null;

    for (let p of pesosValidos) {
        let division = kg / p;
        if (Math.abs(division - Math.round(division)) < 0.01) {
            encontrado = p;
            break;
        }
    }

    if (!encontrado) return;

    bultoSeleccionado[tipo] = encontrado;

    // Actualiza el menú desplegable de forma automática si detecta un peso válido
    let selectContainer = document.getElementById(`bultos_${tipo}`);
    if (!selectContainer) return;

    selectContainer.value = encontrado;
}

function deshacer() {
    if (logs.length === 0) return alert("No hay movimientos para deshacer");

    const ultimoLog = logs[0]; 
    const { tipo, pp, kg, ubi } = ultimoLog;

    // 1. LÓGICA DE REVERSIÓN DE STOCK
    if (tipo === 'ingreso') {
        if (db[ubi] && db[ubi][pp]) {
            // Calculamos el ratio actual para descontar bultos proporcionalmente
            let ratio = db[ubi][pp].bultos / db[ubi][pp].kg;
            db[ubi][pp].kg -= kg;
            db[ubi][pp].bultos -= (kg * ratio);
            
            // Si el stock llega a cero o menos por decimales, eliminamos la entrada
            if (db[ubi][pp].kg <= 0.1) delete db[ubi][pp];
        }
    } else if (tipo === 'salida') {
        if (!db[ubi]) db[ubi] = {};
        if (!db[ubi][pp]) db[ubi][pp] = { kg: 0, bultos: 0 };
        
        // Buscamos el peso del bulto original comparando con la lista de pesos válidos
        let pesoBulto = pesosValidos.find(p => Math.abs((kg / p) - Math.round(kg / p)) < 0.01) || 1000;
        
        db[ubi][pp].kg += kg;
        db[ubi][pp].bultos += (kg / pesoBulto);
    }

    // 2. ACTUALIZACIÓN LOCAL
    logs.shift(); // Quitamos el primer registro del historial
    localStorage.setItem('bodega_db', JSON.stringify(db));
    localStorage.setItem('bodega_logs', JSON.stringify(logs));

    // 3. ☁️ SINCRONIZACIÓN AUTOMÁTICA CON LA NUBE (Firebase)
    // Usamos dbRef.set para que todos los operadores vean el cambio de inmediato
    dbRef.set({
        inventario: db,
        historial: logs
    }).then(() => {
        console.log("Nube actualizada tras deshacer movimiento.");
    }).catch((error) => {
        console.error("Error al sincronizar con la nube:", error);
    });

    // 4. ACTUALIZACIÓN VISUAL Y ALERTAS
    render(); // Redibujamos el mapa y las tablas
    
    // Mantenemos tu alerta original tal como pediste
    alert(`Se ha deshecho el último ${tipo}: ${pp} en ${ubi}`);
}

        fecha: new Date().toISOString(),

            if (backup.db && backup.logs) {

                logs = backup.logs;

                localStorage.setItem('bodega_logs', JSON.stringify(logs));

                notificar("Backup restaurado correctamente", "success");
            } else {
                notificar("Backup incompleto", "error");
            }

        } catch (err) {
            notificar("Archivo inválido", "error");
        }
    };

    reader.readAsText(archivo);
}
function autoBackup() {
    const backup = {
        db: db,
        logs: logs,
        fecha: new Date().toISOString()
    };

    let backups = JSON.parse(localStorage.getItem("bodega_backups")) || [];

    backups.unshift(backup); // guarda al inicio

    // 🔥 mantener solo los últimos 10 backups
    if (backups.length > 10) {
        backups = backups.slice(0, 10);
    }

localStorage.setItem("bodega_backups", JSON.stringify(backups));

    console.log("💾 Auto-backup guardado");
}

// === AQUÍ ES EL CAMBIO CRÍTICO ===
verificarAcceso(); // Primero bloqueamos/permitimos según el link
render();          // Luego dibujamos la página
// ================================

setInterval(autoBackup, 300000); // cada 5 minutos
</script>
